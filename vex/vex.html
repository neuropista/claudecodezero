<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>VEX — Colapso Neuronal</title>
<meta name="description" content="Roguelite de accion y plataformas en WebGL2. Sin motores, sin librerias y sin un solo archivo de imagen o de audio: todo el arte y todo el sonido se generan por codigo en tiempo real.">

  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #04060c; color: #cfe9f5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #juego {
    display: block; width: 100vw; height: 100vh;
    image-rendering: auto; cursor: none; touch-action: none;
  }
  #aviso {
    position: fixed; inset: 0; display: grid; place-content: center;
    text-align: center; padding: 2rem; gap: .5rem;
    background: radial-gradient(circle at 50% 40%, #0d1c31, #04060c 70%);
    z-index: 10;
  }

  #aviso p { margin: .25rem 0; opacity: .8; max-width: 46ch; line-height: 1.5; }
  #aviso.error h1 { color: #ff6f92; }
  .cargando::after {
    content: ''; display: block; width: 200px; height: 3px; margin: 1.5rem auto 0;
    background: linear-gradient(90deg, transparent, #4fe3ff, transparent);
    animation: barrido 1.1s linear infinite;
  }
  @keyframes barrido { from { transform: translateX(-60px); opacity: .2 } 50% { opacity: 1 } to { transform: translateX(60px); opacity: .2 } }
</style>
</head>

  <canvas id="juego" width="1280" height="720" aria-label="VEX: Colapso Neuronal"></canvas>
  <div id="aviso" class="cargando">
    <h1>VEX</h1>
    <p>Generando arte, sonido y niveles por codigo...</p>
  </div>
  <script>
    // Si los modulos no llegan a cargar, la pantalla de carga se quedaria fija
    // para siempre. Este vigia explica el motivo real, que casi siempre es uno
    // de dos: falta la carpeta src/ junto al HTML, o se ha abierto el archivo
    // con doble clic y file:// bloquea los modulos ES por CORS.

      if (window.JUEGO) return;
      var aviso = document.getElementById('aviso');
      if (!aviso || aviso.classList.contains('error')) return;
      var suelto = location.protocol === 'file:';

      aviso.classList.add('error');

        (suelto

            'El navegador bloquea los modulos ES en <code>file://</code>, y ademas ' +
            'este archivo necesita la carpeta <code>src/</code> a su lado.</p>' +
            '<p><strong>Usa <code>vex.html</code></strong>: es el juego entero en un ' +
            'unico archivo y funciona con doble clic.</p>'
          : '<p>Falta la carpeta <code>src/</code> junto a <code>index.html</code>, ' +
            'o el servidor no la esta sirviendo.</p>') +
        '<p>Tambien puedes servir la carpeta completa:<br>' +
        '<code>python3 -m http.server 8000 --directory vex</code></p>';
    }, 5000);
  </script>

  // settings.js — Opciones persistentes en localStorage.
  
  const CLAVE = 'vex.opciones.v1';
  
  const OPCIONES_DEFECTO = {
    volMaster: 0.85,
    volMusica: 0.6,
    volSfx: 0.9,
    bloom: true,
    aberracion: true,
    vineta: true,
    grano: true,
    crt: true,
    flash: true,
    shake: 1.0,
    luces: true,
    sombras: true,
    particulas: 1.0,
    parallax: true,
    escala: 1.0,           // escala de resolución interna
    mostrarFps: false,
    hitstop: true,
    idioma: 'es',
  };
  
  class Settings {
    constructor() {
      this.datos = { ...OPCIONES_DEFECTO };
      this.oyentes = [];
      this.cargar();
    }
  
    get(k) { return this.datos[k]; }
  
    set(k, v) {
      if (this.datos[k] === v) return;
      this.datos[k] = v;
      this.guardar();
      for (const fn of this.oyentes) fn(k, v);
    }
  
    toggle(k) { this.set(k, !this.datos[k]); }
    on(fn) { this.oyentes.push(fn); }
  
    restaurar() {
      for (const k of Object.keys(OPCIONES_DEFECTO)) this.set(k, OPCIONES_DEFECTO[k]);
    }
  
    cargar() {
      try {
        const raw = localStorage.getItem(CLAVE);
        if (!raw) return;
        const obj = JSON.parse(raw);
        for (const k of Object.keys(OPCIONES_DEFECTO)) {
          if (obj[k] !== undefined && typeof obj[k] === typeof OPCIONES_DEFECTO[k]) {
            this.datos[k] = obj[k];
          }
        }
      } catch { /* almacenamiento no disponible: seguimos con los valores por defecto */ }
    }
  
    guardar() {
      try { localStorage.setItem(CLAVE, JSON.stringify(this.datos)); } catch { /* modo privado */ }
    }
  }
  
  Object.assign(exports, { OPCIONES_DEFECTO, Settings });

      cuerpo: '#0d2b28', cuerpoAlto: '#154440', tapa: '#2c9a80', linea: '#6effd6',
      ambiente: [0.26, 0.40, 0.37],
    },
  ];
  
  // ---------------------------------------------------------------- utilidades
  
  /** Segmento grueso con extremos redondeados: la primitiva de todos los cuerpos. */
  function capsula(ctx, x0, y0, x1, y1, r, estilo) {
    ctx.strokeStyle = estilo;
    ctx.lineWidth = r * 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
  
  function brilloExterior(ctx, dibujo, color, radio, alfa = 0.9) {
    ctx.save();
    ctx.shadowColor = color;
    ctx.shadowBlur = radio;
    ctx.globalAlpha = alfa;
    dibujo();
    ctx.shadowBlur = radio * 0.5;
    dibujo();
    ctx.restore();
  }
  
  function estrella(ctx, cx, cy, puntas, rExt, rInt, rot = 0) {
    ctx.beginPath();
    for (let i = 0; i < puntas * 2; i++) {
      const r = i % 2 === 0 ? rExt : rInt;
      const a = rot + (i * Math.PI) / puntas;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }
  
  // ------------------------------------------------------------------- VEX ----
  
  /**
   * Dibuja a Vex a partir de una pose. Toda la animación es matemática:
   * no hay hojas de sprites dibujadas a mano.
   */
  function dibujarVex(ctx, w, h, pose) {
    const cx = w * 0.5;
    const suelo = h * 0.94;
    const {
      bobY = 0, inclina = 0, muslo = 0, muslo2 = 0, rodilla = 0, rodilla2 = 0,
      brazo = 0, brazo2 = 0, estirado = 1, aplasta = 1, capa = 0, ojo = 1, aura = 1,
    } = pose;
  
    const escala = h / 56;
    const caderaY = suelo - 24 * escala * estirado + bobY * escala;
    const caderaX = cx + inclina * 1.2 * escala;
    const hombroY = caderaY - 13 * escala * estirado;
    const hombroX = caderaX + inclina * 2.2 * escala;
    const cabezaY = hombroY - 8 * escala * estirado;
    const cabezaX = hombroX + inclina * 1.4 * escala;
  
    ctx.save();
    ctx.scale(aplasta, 2 - aplasta);
    ctx.translate((w * (1 - aplasta)) / (2 * aplasta), (h * (aplasta - 1)) / (2 * (2 - aplasta)));
  
    // Aura de energía.
    if (aura > 0) halo(ctx, cabezaX, (caderaY + cabezaY) * 0.5, 22 * escala * aura, '79,227,255', 0.20 * aura);
  
    // Estela de datos a la espalda.
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = PAL_VEX.acento;
    ctx.lineWidth = 1.6 * escala;
    ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const ph = capa + i * 0.9;
      ctx.beginPath();
      ctx.moveTo(hombroX - 2 * escala, hombroY + i * 2 * escala);
      for (let s = 1; s <= 4; s++) {
        const t = s / 4;
        ctx.lineTo(
          hombroX - (3 + t * 12) * escala - inclina * 2 * escala,
          hombroY + (i * 2 + Math.sin(ph + t * 3.2) * 4 * t) * escala + t * 8 * escala
        );
      }
      ctx.stroke();
    }
    ctx.restore();
  
    const trazo = () => {
      // Piernas.
      const rodX = caderaX + Math.sin(muslo) * 9 * escala;
      const rodY = caderaY + Math.cos(muslo) * 11 * escala;
      const pieX = rodX + Math.sin(muslo + rodilla) * 9 * escala;
      const pieY = rodY + Math.cos(muslo + rodilla) * 11 * escala;
      capsula(ctx, caderaX, caderaY, rodX, rodY, 3.1 * escala, PAL_VEX.cuerpo);
      capsula(ctx, rodX, rodY, pieX, pieY, 2.5 * escala, PAL_VEX.cuerpo);
  
      const rodX2 = caderaX + Math.sin(muslo2) * 9 * escala;
      const rodY2 = caderaY + Math.cos(muslo2) * 11 * escala;
      const pieX2 = rodX2 + Math.sin(muslo2 + rodilla2) * 9 * escala;
      const pieY2 = rodY2 + Math.cos(muslo2 + rodilla2) * 11 * escala;
      capsula(ctx, caderaX, caderaY, rodX2, rodY2, 3.1 * escala, PAL_VEX.nucleo);
      capsula(ctx, rodX2, rodY2, pieX2, pieY2, 2.5 * escala, PAL_VEX.nucleo);
  
      // Torso.
      ctx.fillStyle = grad(ctx, hombroX, hombroY, caderaX, caderaY, [
        [0, PAL_VEX.cuerpo], [1, PAL_VEX.nucleo],
      ]);
      poly(ctx, [
        hombroX - 6.5 * escala, hombroY,
        hombroX + 6.5 * escala, hombroY,
        caderaX + 4.6 * escala, caderaY + 1 * escala,
        caderaX - 4.6 * escala, caderaY + 1 * escala,
      ]);
      ctx.fill();
  
      // Brazos.
      const codoX = hombroX + Math.sin(brazo) * 8 * escala;
      const codoY = hombroY + Math.cos(brazo) * 9 * escala;
      capsula(ctx, hombroX, hombroY + 1 * escala, codoX, codoY, 2.4 * escala, PAL_VEX.nucleo);
      const manoX = codoX + Math.sin(brazo + 0.6) * 8 * escala;
      const manoY = codoY + Math.cos(brazo + 0.6) * 8 * escala;
      capsula(ctx, codoX, codoY, manoX, manoY, 2.0 * escala, PAL_VEX.nucleo);
  
      const codoX2 = hombroX + Math.sin(brazo2) * 8 * escala;
      const codoY2 = hombroY + Math.cos(brazo2) * 9 * escala;
      capsula(ctx, hombroX, hombroY + 1 * escala, codoX2, codoY2, 2.4 * escala, PAL_VEX.cuerpo);
      const manoX2 = codoX2 + Math.sin(brazo2 + 0.6) * 8 * escala;
      const manoY2 = codoY2 + Math.cos(brazo2 + 0.6) * 8 * escala;
      capsula(ctx, codoX2, codoY2, manoX2, manoY2, 2.0 * escala, PAL_VEX.cuerpo);
      pose._manoX = manoX2; pose._manoY = manoY2;
  
      // Cabeza: casco romboidal con visor.
      ctx.fillStyle = PAL_VEX.cuerpo;
      poly(ctx, [
        cabezaX, cabezaY - 7 * escala,
        cabezaX + 5.6 * escala, cabezaY - 1 * escala,
        cabezaX + 3.4 * escala, cabezaY + 4.4 * escala,
        cabezaX - 3.4 * escala, cabezaY + 4.4 * escala,
        cabezaX - 5.6 * escala, cabezaY - 1 * escala,
      ]);
      ctx.fill();
    };
  
    brilloExterior(ctx, trazo, PAL_VEX.brilloTenue, 8 * escala, 0.85);
    trazo();
  
    // Líneas de circuito luminosas sobre el torso.
    ctx.strokeStyle = PAL_VEX.brillo;
    ctx.lineWidth = 1.1 * escala;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(hombroX - 3 * escala, hombroY + 3 * escala);
    ctx.lineTo(caderaX + 1 * escala, caderaY - 5 * escala);
    ctx.lineTo(caderaX - 2 * escala, caderaY - 1 * escala);
    ctx.stroke();
    ctx.globalAlpha = 1;
  
    // Visor.
    const visorY = cabezaY - 0.5 * escala;
    ctx.save();
    ctx.shadowColor = PAL_VEX.brillo;
    ctx.shadowBlur = 10 * escala;
    ctx.fillStyle = PAL_VEX.energia;
    poly(ctx, [
      cabezaX - 4.2 * escala, visorY - 1.4 * escala,
      cabezaX + 4.2 * escala, visorY - 2.2 * escala,
      cabezaX + 3.6 * escala, visorY + 1.4 * escala,
      cabezaX - 3.8 * escala, visorY + 1.2 * escala,
    ]);
    ctx.globalAlpha = 0.35 + 0.65 * ojo;
    ctx.fill();
    ctx.restore();
  
    // Núcleo del pecho.
    const pechoY = hombroY + 5 * escala;
    halo(ctx, hombroX, pechoY, 5.5 * escala, '255,90,216', 0.85);
    ctx.fillStyle = PAL_VEX.energia;
    ctx.beginPath();
    ctx.arc(hombroX, pechoY, 1.7 * escala, 0, Math.PI * 2);
    ctx.fill();
  
    ctx.restore();
  }
  
  function registrarVex(atlas) {
    const W = 52, H = 58;
  
    atlas.addTira('vex.idle', 6, W, H, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      dibujarVex(ctx, w, h, {
        bobY: Math.sin(t) * 1.1,
        inclina: 0.4,
        muslo: 0.16, muslo2: -0.16, rodilla: 0.10, rodilla2: 0.12,
        brazo: 0.30 + Math.sin(t) * 0.06, brazo2: -0.24 - Math.sin(t) * 0.06,
        capa: t, ojo: 0.75 + 0.25 * Math.sin(t * 2),
        aura: 0.85 + 0.15 * Math.sin(t),
      });
    });
  
    atlas.addTira('vex.correr', 8, W, H, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      dibujarVex(ctx, w, h, {
        bobY: -Math.abs(Math.sin(t)) * 2.2,
        inclina: 2.6,
        muslo: Math.sin(t) * 0.85, muslo2: Math.sin(t + Math.PI) * 0.85,
        rodilla: 0.55 + Math.cos(t) * 0.45, rodilla2: 0.55 + Math.cos(t + Math.PI) * 0.45,
        brazo: Math.sin(t + Math.PI) * 0.75 + 0.15, brazo2: Math.sin(t) * 0.75 + 0.15,
        capa: t * 2, ojo: 1, aura: 1,
      });
    });
  
    atlas.add('vex.salto', W, H, (ctx, w, h) => dibujarVex(ctx, w, h, {
      inclina: 1.4, estirado: 1.06, aplasta: 0.9,
      muslo: -0.7, muslo2: 0.55, rodilla: 1.05, rodilla2: 0.30,
      brazo: -1.15, brazo2: 0.85, capa: 1.2, ojo: 1, aura: 1.15,
    }));
  
    atlas.add('vex.caida', W, H, (ctx, w, h) => dibujarVex(ctx, w, h, {
      inclina: 0.9, estirado: 0.97, aplasta: 1.06,
      muslo: 0.55, muslo2: -0.35, rodilla: 0.65, rodilla2: 0.85,
      brazo: -0.55, brazo2: -0.95, capa: 2.4, ojo: 1, aura: 1,
    }));
  
    atlas.add('vex.dash', W, H, (ctx, w, h) => dibujarVex(ctx, w, h, {
      inclina: 5.5, estirado: 0.9, aplasta: 1.18,
      muslo: 1.25, muslo2: 0.55, rodilla: 0.35, rodilla2: 0.95,
      brazo: 1.5, brazo2: 1.25, capa: 3.6, ojo: 1, aura: 1.5,
    }));
  
    atlas.add('vex.pared', W, H, (ctx, w, h) => dibujarVex(ctx, w, h, {
      inclina: -1.8, estirado: 0.98,
      muslo: -0.30, muslo2: 0.62, rodilla: 0.95, rodilla2: 0.30,
      brazo: -1.5, brazo2: 0.35, capa: 0.7, ojo: 0.9, aura: 0.9,
    }));
  
    atlas.add('vex.parry', W, H, (ctx, w, h) => {
      dibujarVex(ctx, w, h, {
        inclina: 1.0, estirado: 0.99,
        muslo: 0.45, muslo2: -0.42, rodilla: 0.35, rodilla2: 0.40,
        brazo: 1.45, brazo2: 1.35, capa: 0.4, ojo: 1, aura: 1.4,
      });
      // Abanico de deflexión.
      ctx.save();
      ctx.strokeStyle = PAL_VEX.acento;
      ctx.shadowColor = PAL_VEX.acento;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(w * 0.62, h * 0.56, w * 0.36, -0.95, 0.95);
      ctx.stroke();
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.restore();
    });
  
    atlas.add('vex.golpe', W, H, (ctx, w, h) => {
      dibujarVex(ctx, w, h, {
        inclina: -2.2, estirado: 0.94, aplasta: 1.1,
        muslo: -0.5, muslo2: 0.2, rodilla: 0.9, rodilla2: 0.5,
        brazo: -1.4, brazo2: -1.1, capa: 5.0, ojo: 0.2, aura: 0.5,
      });
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,70,90,0.55)';
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    });
  }
  
  // --------------------------------------------------------------- enemigos ---
  
  const CHASIS = '#1a1520';
  const CHASIS_ALTO = '#2e2438';
  const HOSTIL = '#ff3d6e';
  const HOSTIL_TENUE = '#8a1e3c';
  
  function registrarEnemigos(atlas) {
    // Dron flotante: rombo con anillo y ojo central.
    atlas.addTira('enem.dron', 6, 44, 44, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h / 2 + Math.sin(t) * 2;
      halo(ctx, cx, cy, 20, '255,61,110', 0.30);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t * 0.5);
      ctx.fillStyle = grad(ctx, -14, -14, 14, 14, [[0, CHASIS_ALTO], [1, CHASIS]]);
      poly(ctx, [0, -15, 13, 0, 0, 15, -13, 0]);
      ctx.fill();
      ctx.strokeStyle = HOSTIL_TENUE;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
      // Anillo orbital.
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-t);
      ctx.strokeStyle = HOSTIL;
      ctx.lineWidth = 1.8;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 6, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      // Ojo.
      halo(ctx, cx, cy, 8, '255,61,110', 0.95);
      ctx.fillStyle = '#ffd9e4';
      ctx.beginPath();
      ctx.arc(cx, cy, 3 + Math.sin(t * 2) * 0.6, 0, Math.PI * 2);
      ctx.fill();
    });
  
    // Rastreador: cuadrúpedo bajo con patas animadas.
    atlas.addTira('enem.rastreador', 6, 52, 44, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h * 0.52;
      ctx.strokeStyle = CHASIS_ALTO;
      ctx.lineCap = 'round';
      for (let p = 0; p < 4; p++) {
        const f = t + p * 1.6;
        const bx = cx + (p < 2 ? -1 : 1) * (8 + (p % 2) * 6);
        const kx = bx + Math.sin(f) * 6;
        const ky = cy + 9;
        ctx.lineWidth = 3.2;
        ctx.beginPath(); ctx.moveTo(bx, cy + 2); ctx.lineTo(kx, ky); ctx.stroke();
        ctx.lineWidth = 2.4;
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(kx + Math.cos(f) * 3, h * 0.94); ctx.stroke();
      }
      halo(ctx, cx, cy, 18, '255,61,110', 0.22);
      ctx.fillStyle = grad(ctx, cx - 18, cy - 10, cx + 18, cy + 10, [[0, CHASIS_ALTO], [1, CHASIS]]);
      rectRedondo(ctx, cx - 19, cy - 11, 38, 20, 8);
      ctx.fill();
      ctx.strokeStyle = HOSTIL_TENUE; ctx.lineWidth = 2; ctx.stroke();
      // Visor de barrido.
      ctx.save();
      ctx.shadowColor = HOSTIL; ctx.shadowBlur = 10;
      ctx.fillStyle = HOSTIL;
      const off = Math.sin(t) * 5;
      rectRedondo(ctx, cx - 12 + off, cy - 5, 12, 4, 2);
      ctx.fill();
      ctx.restore();
      // Placas dorsales.
      ctx.fillStyle = HOSTIL_TENUE;
      for (let p = 0; p < 3; p++) {
        poly(ctx, [cx - 12 + p * 11, cy - 11, cx - 7 + p * 11, cy - 17, cx - 3 + p * 11, cy - 11]);
        ctx.fill();
      }
    });
  
    // Torreta: base fija + cañón separado que rota en el juego.
    atlas.addTira('enem.torreta', 4, 48, 40, (ctx, w, h, i, n) => {
      const t = i / n;
      const cx = w / 2, cy = h * 0.72;
      ctx.fillStyle = grad(ctx, 0, cy - 14, 0, h, [[0, CHASIS_ALTO], [1, '#0d0a12']]);
      poly(ctx, [cx - 20, h, cx - 14, cy - 8, cx + 14, cy - 8, cx + 20, h]);
      ctx.fill();
      ctx.strokeStyle = HOSTIL_TENUE; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = CHASIS;
      ctx.beginPath(); ctx.arc(cx, cy - 8, 11, Math.PI, 0); ctx.fill();
      // Luz de carga.
      const p = 0.3 + 0.7 * t;
      halo(ctx, cx, cy - 10, 9 * p, '255,61,110', 0.9 * p);
      ctx.fillStyle = '#ffe6ee';
      ctx.beginPath(); ctx.arc(cx, cy - 10, 2.6, 0, Math.PI * 2); ctx.fill();
    });
  
    atlas.add('enem.canon', 40, 18, (ctx, w, h) => {
      const cy = h / 2;
      ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, CHASIS_ALTO], [0.5, CHASIS], [1, '#0b0810']]);
      rectRedondo(ctx, 2, cy - 6, w - 8, 12, 5);
      ctx.fill();
      ctx.strokeStyle = HOSTIL_TENUE; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.fillStyle = HOSTIL;
      rectRedondo(ctx, w - 10, cy - 3.5, 8, 7, 3);
      ctx.fill();
      halo(ctx, w - 5, cy, 8, '255,61,110', 0.8);
    }, 0.12, 0.5);
  
    // Enjambre: motas rápidas.
    atlas.addTira('enem.enjambre', 4, 22, 22, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h / 2;
      halo(ctx, cx, cy, 10, '255,120,60', 0.75);
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(t);
      ctx.fillStyle = '#ffb066';
      estrella(ctx, 0, 0, 3, 8, 3.2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#fff2e0';
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();
    });
  
    // Volador: alas batientes.
    atlas.addTira('enem.volador', 6, 52, 40, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h / 2;
      const ala = Math.sin(t) * 0.9;
      ctx.save();
      ctx.translate(cx, cy);
      for (const s of [-1, 1]) {
        ctx.save();
        ctx.scale(s, 1);
        ctx.rotate(ala * 0.5);
        ctx.fillStyle = 'rgba(190,80,255,0.55)';
        poly(ctx, [4, -2, 24, -12 - ala * 5, 22, 2, 6, 5]);
        ctx.fill();
        ctx.strokeStyle = '#c98bff'; ctx.lineWidth = 1.4; ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      halo(ctx, cx, cy, 14, '190,110,255', 0.35);
      ctx.fillStyle = grad(ctx, cx, cy - 10, cx, cy + 10, [[0, CHASIS_ALTO], [1, CHASIS]]);
      ctx.beginPath(); ctx.ellipse(cx, cy, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#8c4fd0'; ctx.lineWidth = 2; ctx.stroke();
      halo(ctx, cx, cy - 2, 7, '220,150,255', 0.9);
      ctx.fillStyle = '#f3e0ff';
      ctx.beginPath(); ctx.arc(cx, cy - 2, 2.6, 0, Math.PI * 2); ctx.fill();
    });
  
    // Escudo: hexágono con placa frontal (hay que rodearlo).
    atlas.addTira('enem.escudo', 4, 60, 60, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h / 2;
      halo(ctx, cx, cy, 26, '90,180,255', 0.28);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = grad(ctx, -20, -20, 20, 20, [[0, CHASIS_ALTO], [1, CHASIS]]);
      estrella(ctx, 0, 0, 6, 20, 17, Math.PI / 6);
      ctx.fill();
      ctx.strokeStyle = '#3b7fc4'; ctx.lineWidth = 2.4; ctx.stroke();
      // Placa de escudo con brillo animado.
      ctx.save();
      ctx.globalAlpha = 0.55 + 0.35 * Math.sin(t);
      ctx.shadowColor = '#6fd4ff'; ctx.shadowBlur = 14;
      ctx.strokeStyle = '#9fe6ff'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, 24, -0.85, 0.85); ctx.stroke();
      ctx.restore();
      ctx.restore();
      halo(ctx, cx, cy, 9, '255,61,110', 0.8);
      ctx.fillStyle = '#ffdfe8';
      ctx.beginPath(); ctx.arc(cx, cy, 3.4, 0, Math.PI * 2); ctx.fill();
    });
  
    // Tejedor: nodo que tiende un cable de energía con su pareja.
    atlas.addTira('enem.tejedor', 5, 46, 46, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h / 2;
      halo(ctx, cx, cy, 20, '90,255,210', 0.35);
      // Filamentos que giran.
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t * 0.6);
      ctx.strokeStyle = '#5cffcf';
      ctx.lineCap = 'round';
      ctx.globalAlpha = 0.75;
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2;
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 9, Math.sin(a) * 9);
        ctx.lineTo(Math.cos(a) * (17 + Math.sin(t + k) * 3), Math.sin(a) * (17 + Math.sin(t + k) * 3));
        ctx.stroke();
      }
      ctx.restore();
      // Cuerpo romboidal.
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = grad(ctx, -10, -10, 10, 10, [[0, '#1d4a42'], [1, '#0b201d']]);
      ctx.fillRect(-9, -9, 18, 18);
      ctx.strokeStyle = '#3fd7ae'; ctx.lineWidth = 2; ctx.strokeRect(-9, -9, 18, 18);
      ctx.restore();
      halo(ctx, cx, cy, 8, '160,255,230', 0.95);
      ctx.fillStyle = '#e8fff8';
      ctx.beginPath(); ctx.arc(cx, cy, 3 + Math.sin(t * 2) * 0.6, 0, Math.PI * 2); ctx.fill();
    });
  
    // Espejo (placa puesta): devuelve los disparos que le llegan de frente.
    atlas.addTira('enem.espejo', 4, 56, 52, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2 - 4, cy = h / 2;
      halo(ctx, cx, cy, 20, '150,190,255', 0.28);
      // Cuerpo hexagonal.
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = grad(ctx, -16, -16, 16, 16, [[0, CHASIS_ALTO], [1, CHASIS]]);
      estrella(ctx, 0, 0, 6, 16, 14, Math.PI / 6);
      ctx.fill();
      ctx.strokeStyle = '#5f7fb8'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
      // Placa reflectante, montada hacia +x (el sprite se voltea con la mirada).
      ctx.save();
      ctx.translate(cx + 6, cy);
      ctx.shadowColor = '#bfe4ff'; ctx.shadowBlur = 12;
      const g = ctx.createLinearGradient(0, -20, 8, 20);
      g.addColorStop(0, 'rgba(220,240,255,0.95)');
      g.addColorStop(0.45 + 0.12 * Math.sin(t), 'rgba(255,255,255,1)');
      g.addColorStop(1, 'rgba(150,190,235,0.85)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(-4, 0, 20, -1.05, 1.05); ctx.stroke();
      ctx.globalAlpha = 0.4; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(-4, 0, 20, -1.05, 1.05); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#8fb4e8';
      ctx.beginPath(); ctx.arc(cx - 4, cy, 3, 0, Math.PI * 2); ctx.fill();
    });
  
    // Espejo abierto: la placa se retira y deja el núcleo a tiro.
    atlas.addTira('enem.espejoAbierto', 3, 56, 52, (ctx, w, h, i, n) => {
      const t = i / (n - 1);
      const cx = w / 2 - 4, cy = h / 2;
      halo(ctx, cx, cy, 24, '90,255,150', 0.5);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = grad(ctx, -16, -16, 16, 16, [[0, CHASIS_ALTO], [1, CHASIS]]);
      estrella(ctx, 0, 0, 6, 16, 14, Math.PI / 6);
      ctx.fill();
      ctx.strokeStyle = '#4fa87a'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
      // Las dos mitades de la placa, separadas.
      ctx.save();
      ctx.translate(cx + 6, cy);
      ctx.strokeStyle = 'rgba(200,225,255,0.8)';
      ctx.lineWidth = 5;
      for (const s2 of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(-4, s2 * (7 + t * 9), 20, s2 > 0 ? 0.12 : -1.05, s2 > 0 ? 1.05 : -0.12);
        ctx.stroke();
      }
      ctx.restore();
      // Núcleo expuesto.
      halo(ctx, cx, cy, 12, '110,255,170', 0.95);
      ctx.fillStyle = '#e6fff0';
      ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, Math.PI * 2); ctx.fill();
    });
  
    // Divisor: masa que se parte en dos al morir.
    atlas.addTira('enem.divisor', 4, 52, 48, (ctx, w, h, i, n, r) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h / 2;
      halo(ctx, cx, cy, 22, '255,110,190', 0.32);
      const wob = 1 + Math.sin(t) * 0.06;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(wob, 2 - wob);
      ctx.fillStyle = grad(ctx, -20, -18, 20, 18, [[0, '#4a1638'], [1, '#1c0714']]);
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 17, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ff62be'; ctx.lineWidth = 2.2; ctx.stroke();
      // Costura por donde se partirá.
      ctx.strokeStyle = 'rgba(255,150,215,0.55)';
      ctx.lineWidth = 1.6;
      ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.moveTo(0, -17); ctx.lineTo(0, 17); ctx.stroke();
      ctx.setLineDash([]);
      // Células internas.
      for (let k = 0; k < 3; k++) {
        const a = t + k * 2.1;
        halo(ctx, Math.cos(a) * 7, Math.sin(a * 1.3) * 5, 6, '255,150,215', 0.7);
      }
      ctx.restore();
      ctx.fillStyle = '#ffd9f0';
      ctx.beginPath(); ctx.arc(cx, cy - 4, 3, 0, Math.PI * 2); ctx.fill();
    });
  
    // Bombardero: cuerpo esférico inestable.
    atlas.addTira('enem.bombardero', 5, 48, 48, (ctx, w, h, i, n) => {
      const t = i / n;
      const cx = w / 2, cy = h / 2;
      const pulso = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);
      halo(ctx, cx, cy, 22 + pulso * 6, '255,150,40', 0.35 + pulso * 0.3);
      ctx.fillStyle = grad(ctx, cx - 16, cy - 16, cx + 16, cy + 16, [[0, '#3a2416'], [1, '#16100a']]);
      ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#b06a20'; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.save();
      ctx.globalAlpha = 0.4 + pulso * 0.6;
      ctx.shadowColor = '#ffae4a'; ctx.shadowBlur = 16;
      ctx.strokeStyle = '#ffc46a'; ctx.lineWidth = 2.2;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.arc(cx, cy, 6 + k * 4.5, k * 1.7 + t * 4, k * 1.7 + t * 4 + 2.1);
        ctx.stroke();
      }
      ctx.restore();
    });
  }
  
  // ------------------------------------------------------------------ jefes ---
  
  function registrarJefes(atlas) {
    atlas.addTira('jefe.nucleo', 6, 148, 148, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      const cx = w / 2, cy = h / 2;
      halo(ctx, cx, cy, 70, '255,70,120', 0.30);
      // Caparazón fracturado.
      ctx.save();
      ctx.translate(cx, cy);
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2 + t * 0.15;
        const r0 = 34, r1 = 58 + Math.sin(t + k) * 4;
        ctx.save();
        ctx.rotate(a);
        ctx.fillStyle = grad(ctx, 0, -r1, 0, -r0, [[0, '#2b1120'], [1, '#5a1f34']]);
        poly(ctx, [-13, -r0, -9, -r1, 9, -r1, 13, -r0]);
        ctx.fill();
        ctx.strokeStyle = '#ff5f86'; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.7; ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      // Anillos internos.
      ctx.save();
      ctx.translate(cx, cy);
      for (let k = 0; k < 3; k++) {
        ctx.rotate(t * (k % 2 === 0 ? 0.4 : -0.6));
        ctx.strokeStyle = k === 1 ? '#ff9ec2' : '#ff4f7e';
        ctx.lineWidth = 3 - k * 0.6;
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.ellipse(0, 0, 30 - k * 7, 22 - k * 6, k * 0.8, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
      // Núcleo.
      const p = 0.6 + 0.4 * Math.sin(t * 2);
      halo(ctx, cx, cy, 26 * p, '255,220,240', 0.95);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx, cy, 8 * p, 0, Math.PI * 2); ctx.fill();
    });
  
    atlas.add('jefe.brazo', 96, 40, (ctx, w, h) => {
      const cy = h / 2;
      ctx.fillStyle = grad(ctx, 0, cy - 14, 0, cy + 14, [[0, '#5a1f34'], [1, '#1d0a14']]);
      poly(ctx, [4, cy - 11, w - 16, cy - 15, w - 2, cy, w - 16, cy + 15, 4, cy + 11]);
      ctx.fill();
      ctx.strokeStyle = '#ff5f86'; ctx.lineWidth = 2; ctx.stroke();
      for (let k = 0; k < 4; k++) {
        halo(ctx, 16 + k * 20, cy, 7, '255,90,140', 0.6);
      }
    }, 0.05, 0.5);
  
    atlas.addTira('jefe.ojo', 4, 56, 56, (ctx, w, h, i, n) => {
      const t = i / n;
      const cx = w / 2, cy = h / 2;
      halo(ctx, cx, cy, 24, '255,70,120', 0.6);
      ctx.fillStyle = '#2b1120';
      ctx.beginPath(); ctx.ellipse(cx, cy, 22, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ff5f86'; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.fillStyle = '#ffe3ee';
      ctx.beginPath(); ctx.arc(cx + (t - 0.5) * 12, cy, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5c0a24';
      ctx.beginPath(); ctx.arc(cx + (t - 0.5) * 12, cy, 3, 0, Math.PI * 2); ctx.fill();
    });
  }
  
  // ----------------------------------------------------------- proyectiles ----
  
  function bala(atlas, nombre, w, h, color, dibujo) {
    atlas.add(nombre, w, h, (ctx) => {
      halo(ctx, w / 2, h / 2, Math.min(w, h) * 0.5, color, 0.85);
      dibujo(ctx, w, h);
    });
  }
  
  function registrarProyectiles(atlas) {
    bala(atlas, 'bala.base', 26, 14, '90,230,255', (ctx, w, h) => {
      ctx.fillStyle = grad(ctx, 0, 0, w, 0, [[0, 'rgba(80,220,255,0.1)'], [0.6, '#7fe8ff'], [1, '#ffffff']]);
      rectRedondo(ctx, 2, h / 2 - 3, w - 4, 6, 3);
      ctx.fill();
    });
  
    bala(atlas, 'bala.perfora', 34, 12, '255,240,140', (ctx, w, h) => {
      ctx.fillStyle = grad(ctx, 0, 0, w, 0, [[0, 'rgba(255,240,140,0.05)'], [0.7, '#ffe98a'], [1, '#fffdf0']]);
      poly(ctx, [1, h / 2, w * 0.55, h / 2 - 4.5, w - 1, h / 2, w * 0.55, h / 2 + 4.5]);
      ctx.fill();
    });
  
    bala(atlas, 'bala.rebote', 20, 20, '120,255,180', (ctx, w, h) => {
      ctx.fillStyle = '#8effc4';
      estrella(ctx, w / 2, h / 2, 5, 8, 3.6);
      ctx.fill();
      ctx.fillStyle = '#f2fff8';
      ctx.beginPath(); ctx.arc(w / 2, h / 2, 2.6, 0, Math.PI * 2); ctx.fill();
    });
  
    bala(atlas, 'bala.buscador', 22, 16, '255,140,230', (ctx, w, h) => {
      ctx.fillStyle = '#ff96e6';
      poly(ctx, [2, h / 2, w * 0.6, 2, w - 2, h / 2, w * 0.6, h - 2]);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(w * 0.62, h / 2, 2.4, 0, Math.PI * 2); ctx.fill();
    });
  
    bala(atlas, 'bala.escopeta', 16, 10, '255,190,90', (ctx, w, h) => {
      ctx.fillStyle = '#ffcf80';
      ctx.beginPath(); ctx.ellipse(w / 2, h / 2, 6, 3.2, 0, 0, Math.PI * 2); ctx.fill();
    });
  
    bala(atlas, 'bala.orbital', 24, 24, '160,190,255', (ctx, w, h) => {
      ctx.strokeStyle = '#b8ccff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(w / 2, h / 2, 8, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#e8f0ff';
      ctx.beginPath(); ctx.arc(w / 2, h / 2, 3.4, 0, Math.PI * 2); ctx.fill();
    });
  
    bala(atlas, 'bala.cadena', 18, 18, '180,120,255', (ctx, w, h) => {
      ctx.fillStyle = '#c79bff';
      estrella(ctx, w / 2, h / 2, 4, 8, 2.4, 0.4);
      ctx.fill();
    });
  
    bala(atlas, 'bala.enemiga', 18, 18, '255,70,110', (ctx, w, h) => {
      ctx.fillStyle = '#ff6f92';
      ctx.beginPath(); ctx.arc(w / 2, h / 2, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(w / 2, h / 2, 2.2, 0, Math.PI * 2); ctx.fill();
    });
  
    bala(atlas, 'bala.enemigaGrande', 28, 28, '255,110,60', (ctx, w, h) => {
      ctx.fillStyle = '#ff9a4a';
      estrella(ctx, w / 2, h / 2, 6, 11, 6);
      ctx.fill();
      ctx.fillStyle = '#fff3e0';
      ctx.beginPath(); ctx.arc(w / 2, h / 2, 3.6, 0, Math.PI * 2); ctx.fill();
    });
  
    // Segmento repetible para láseres y cadenas eléctricas.
    atlas.add('fx.haz', 32, 16, (ctx, w, h) => {
      ctx.fillStyle = grad(ctx, 0, 0, 0, h, [
        [0, 'rgba(255,255,255,0)'], [0.35, 'rgba(255,255,255,0.55)'],
        [0.5, '#ffffff'], [0.65, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)'],
      ]);
      ctx.fillRect(0, 0, w, h);
    });
  }
  
  // ------------------------------------------------------------------ tiles ---
  
  function registrarTiles(atlas, rng) {
    PALETAS_BIOMA.forEach((P, b) => {
      // Cuerpo: cuatro variantes para romper la repetición.
      for (let v = 0; v < 4; v++) {
        atlas.add(`tile.${b}.cuerpo.${v}`, 32, 32, (ctx, w, h, r) => {
          ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, P.cuerpoAlto], [1, P.cuerpo]]);
          ctx.fillRect(0, 0, w, h);
          // Circuitería interna determinista por variante.
          ctx.strokeStyle = P.linea;
          ctx.globalAlpha = 0.16;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          const paso = 8 + v * 2;
          for (let x = -h; x < w; x += paso) { ctx.moveTo(x, h); ctx.lineTo(x + h, 0); }
          ctx.stroke();
          ctx.globalAlpha = 1;
          // Remaches.
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          const n = 2 + (v % 3);
          for (let k = 0; k < n; k++) {
            ctx.beginPath();
            ctx.arc(6 + ((v * 7 + k * 11) % 20), 8 + ((v * 5 + k * 13) % 18), 1.8, 0, Math.PI * 2);
            ctx.fill();
          }
          granular(ctx, w, h, r, 0.05, 2);
          // Sombra interior en los bordes.
          ctx.strokeStyle = 'rgba(0,0,0,0.45)';
          ctx.lineWidth = 2;
          ctx.strokeRect(1, 1, w - 2, h - 2);
        });
      }
  
      // Tapa: superficie superior iluminada.
      for (let v = 0; v < 2; v++) {
        atlas.add(`tile.${b}.tapa.${v}`, 32, 32, (ctx, w, h, r) => {
          ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, P.tapa], [0.35, P.cuerpoAlto], [1, P.cuerpo]]);
          ctx.fillRect(0, 0, w, h);
          ctx.save();
          ctx.shadowColor = P.linea; ctx.shadowBlur = 8;
          ctx.fillStyle = P.linea;
          ctx.globalAlpha = 0.9;
          ctx.fillRect(0, 0, w, 2.5);
          ctx.restore();
          ctx.fillStyle = 'rgba(255,255,255,0.10)';
          for (let k = 0; k < 4; k++) ctx.fillRect(2 + k * 8 + v * 3, 4, 4, 1.5);
          granular(ctx, w, h, r, 0.05, 2);
          ctx.strokeStyle = 'rgba(0,0,0,0.4)';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(0, h); ctx.lineTo(w, h); ctx.stroke();
        });
      }
  
      // Plataforma de un solo sentido.
      atlas.add(`tile.${b}.plataforma`, 32, 14, (ctx, w, h) => {
        ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, P.tapa], [1, P.cuerpo]]);
        rectRedondo(ctx, 0, 0, w, h - 2, 3);
        ctx.fill();
        ctx.save();
        ctx.shadowColor = P.linea; ctx.shadowBlur = 10;
        ctx.fillStyle = P.linea;
        ctx.fillRect(0, 0, w, 2);
        ctx.restore();
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.fillRect(0, h - 3, w, 3);
      });
  
      // Rampas.
      for (const [nom, pts] of [['rampaDer', [0, 32, 32, 0, 32, 32]], ['rampaIzq', [0, 0, 32, 32, 0, 32]]]) {
        atlas.add(`tile.${b}.${nom}`, 32, 32, (ctx, w, h, r) => {
          ctx.save();
          poly(ctx, pts);
          ctx.clip();
          ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, P.tapa], [0.4, P.cuerpoAlto], [1, P.cuerpo]]);
          ctx.fillRect(0, 0, w, h);
          granular(ctx, w, h, r, 0.05, 2);
          ctx.restore();
          ctx.save();
          ctx.shadowColor = P.linea; ctx.shadowBlur = 8;
          ctx.strokeStyle = P.linea; ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(pts[0], pts[1]); ctx.lineTo(pts[2], pts[3]);
          ctx.stroke();
          ctx.restore();
        });
      }
  
      // Fondo decorativo del bioma (relleno de huecos).
      atlas.add(`tile.${b}.fondo`, 32, 32, (ctx, w, h, r) => {
        ctx.fillStyle = P.fondoB;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = P.acento;
        ctx.globalAlpha = 0.12;
        ctx.lineWidth = 1;
        ctx.strokeRect(4, 4, w - 8, h - 8);
        ctx.globalAlpha = 1;
        granular(ctx, w, h, r, 0.03, 2);
      });
    });
  
    // Cinta transportadora animada.
    atlas.addTira('tile.cinta', 8, 32, 16, (ctx, w, h, i, n) => {
      ctx.fillStyle = '#151b28';
      rectRedondo(ctx, 0, 1, w, h - 2, 4);
      ctx.fill();
      ctx.save();
      ctx.beginPath(); rectRedondo(ctx, 1, 2, w - 2, h - 4, 3); ctx.clip();
      ctx.fillStyle = '#2a3550';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#5ad0ff';
      const off = (i / n) * 12;
      for (let x = -12; x < w + 12; x += 12) {
        poly(ctx, [x + off, 2, x + off + 5, 2, x + off - 2, h - 2, x + off - 7, h - 2]);
        ctx.fill();
      }
      ctx.restore();
      ctx.save();
      ctx.shadowColor = '#5ad0ff'; ctx.shadowBlur = 6;
      ctx.strokeStyle = '#8ce0ff'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(1, 2.5); ctx.lineTo(w - 1, 2.5); ctx.stroke();
      ctx.restore();
    });
  
    // Gel / fluido de datos.
    atlas.addTira('tile.gel', 6, 32, 32, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      ctx.fillStyle = 'rgba(60,200,255,0.30)';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(160,240,255,0.55)';
      ctx.lineWidth = 1.6;
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        for (let x = 0; x <= w; x += 4) {
          const y = 6 + k * 10 + Math.sin(t + x * 0.16 + k) * 2.2;
          if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(200,250,255,0.5)';
      for (let k = 0; k < 4; k++) {
        const bx = (k * 9 + 5) % w;
        const by = (h - ((t * 4 + k * 9) % h));
        ctx.beginPath(); ctx.arc(bx, by, 1.6, 0, Math.PI * 2); ctx.fill();
      }
    });
  
    // Superficie del fluido.
    atlas.addTira('tile.gelTapa', 6, 32, 12, (ctx, w, h, i, n) => {
      const t = (i / n) * Math.PI * 2;
      ctx.save();
      ctx.shadowColor = '#7fe9ff'; ctx.shadowBlur = 8;
      ctx.strokeStyle = '#aef2ff'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 3) {
        const y = h * 0.5 + Math.sin(t + x * 0.22) * 2.4;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = 'rgba(60,200,255,0.30)';
      ctx.fillRect(0, h * 0.5, w, h * 0.5);
    });
  
    // Pinchos.
    atlas.add('tile.pincho', 32, 20, (ctx, w, h) => {
      for (let k = 0; k < 4; k++) {
        const x = 4 + k * 8;
        ctx.fillStyle = grad(ctx, x, h, x, 0, [[0, '#2a2030'], [1, '#e0eaf5']]);
        poly(ctx, [x - 4, h, x, 1, x + 4, h]);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,90,120,0.55)'; ctx.lineWidth = 1;
        ctx.stroke();
      }
      ctx.fillStyle = '#16121c';
      ctx.fillRect(0, h - 4, w, 4);
    }, 0.5, 1);
  
    // Bloque destructible.
    atlas.addTira('tile.fragil', 3, 32, 32, (ctx, w, h, i) => {
      ctx.fillStyle = grad(ctx, 0, 0, 0, h, [[0, '#4a3b2a'], [1, '#241c14']]);
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#c79a5a'; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.7;
      ctx.strokeRect(2, 2, w - 4, h - 4);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.6;
      const grietas = i + 1;
      for (let k = 0; k < grietas * 3; k++) {
        const a = (k / (grietas * 3)) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(16, 16);
        ctx.lineTo(16 + Math.cos(a) * 15, 16 + Math.sin(a) * 15);
        ctx.stroke();
      }
    });
  }
  
  // ------------------------------------------------------------------ props ---
  
  function registrarProps(atlas) {
    // Puerta de sala: 6 fotogramas de apertura. Con marco y pilares para que se
    // lea como una puerta y no como una barra suelta a media altura.
    atlas.addTira('prop.puerta', 6, 52, 104, (ctx, w, h, i, n) => {
      const t = i / (n - 1);
      const abierta = t > 0.9;
      const acento = abierta ? '#5effc0' : '#ff4f7e';
  
      // Pilares laterales.

          Math.cos(a) * v, Math.sin(a) * v,

          tam * (0.5 + cosmeticRng.float()),
          3.5, -40, 0.15,
          r, g, b, 0.85, TIPO.NIEBLA,
        );

    /** Motas ambientales que flotan por el bioma. */

          r, g, b, 0.55, TIPO.NIEBLA,

    // ------------------------------------------------------------- ciclo -----
  
    actualizar(dt) {
      if (!this.activo) return;
      const gl = this.gl;

      gl.bindBuffer(gl.ARRAY_BUFFER, this.buffers[this.src]);

      const gl = this.gl;
      const vacio = new Float32Array(this.max * FLOATS);
      for (const b of this.buffers) {
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, vacio);
      }
      this.cursor = 0; this.stagingN = 0; this.stagingInicio = 0;
    }
  }

  // lighting.js — Luces 2D dinámicas con sombras duras por raycast.

  const MAX_VERTICES_FAN = 1600;
  const MAX_SEG_CANDIDATOS = 512;
  const RAYOS_BASE = 28;              // rayos de relleno para que el círculo sea redondo
  const EPS = 0.00035;
  
  class Iluminacion {
    constructor(gl, ancho, alto) {
      this.gl = gl;

      this.programa = new Program(gl, LUZ_VS, LUZ_FS, 'luz');

      this.lx = new Float32Array(MAX_LUCES);
      this.ly = new Float32Array(MAX_LUCES);
      this.lr = new Float32Array(MAX_LUCES);
      this.lcol = new Float32Array(MAX_LUCES * 3);
      this.lint = new Float32Array(MAX_LUCES);
      this.lang = new Float32Array(MAX_LUCES);

      this.segs = new Float32Array(0);

      this.hashDatos = null;
      this.gridW = 0; this.gridH = 0;
      this.origenX = 0; this.origenY = 0;

      this.selloActual = 1;

      this.angulos = new Float32Array(MAX_VERTICES_FAN);
      this.puntos = new Float32Array(MAX_VERTICES_FAN * 3);   // ang, x, y

    redimensionar(w, h) { this.objetivo.redimensionar(w, h); }
  
    /**
     * Publica la geometría de oclusión del nivel.
     * @param {Float32Array} segs  [x0,y0,x1,y1] por segmento

    setGeometria(segs, nsegs, minX, minY, maxX, maxY) {

      this.gridH = Math.max(1, Math.ceil((maxY - minY) / this.celda));

    _recolectar(lx, ly, radio) {

   *    `approach()` de cada IA lo cancelaba al tick siguiente y no separaba nada.
   *  · Si dos enemigos caen exactamente en el mismo punto la dirección de empuje
   *    es indefinida; se usa un ángulo derivado del id (determinista) para que
   *    una pila perfecta también se deshaga.
   */
  const EMPUJE_MAX = 130;        // px/s
  const ANGULO_DORADO = 2.39996322972865332;
  
  function separarEnemigos(mundo, dt) {
    const S = mundo.ent;
    const rej = mundo.rejillaEnemigos;
    for (let i = 0; i < S.count; i++) {
      const e = S.dense[i];
      if (S.alive[e] !== 1 || (S.mask[e] & MASK.ENEMIGO) === 0) continue;
      const tipo = S.tipo[e];
      if (tipo === TIPO.TORRETA || tipo === TIPO.JEFE || tipo === TIPO.JEFE_OJO) continue;
  
      const radio = S.hw[e] + 26;
      const n = rej.consultar(S.x[e], S.y[e], radio);
      let ex = 0, ey = 0, cuenta = 0;
      for (let k = 0; k < n; k++) {
        const o = rej.resultado[k];
        if (o === e || S.alive[o] !== 1) continue;
        const tipoO = S.tipo[o];
        if (tipoO === TIPO.TORRETA || tipoO === TIPO.JEFE || tipoO === TIPO.JEFE_OJO) continue;
        const dx = S.x[e] - S.x[o], dy = S.y[e] - S.y[o];
        const d2 = dx * dx + dy * dy;
        const min = S.hw[e] + S.hw[o];
        if (d2 > min * min) continue;
        cuenta++;
        if (d2 < 0.25) {
          // Superpuestos del todo: dirección estable a partir del id.
          const a = e * ANGULO_DORADO;
          ex += Math.cos(a); ey += Math.sin(a);
        } else {
          const d = Math.sqrt(d2);
          const fuerza = 1 - d / min;
          ex += (dx / d) * fuerza;
          ey += (dy / d) * fuerza;
        }
      }
      if (cuenta === 0) continue;
  
      // Se acota la suma: con muchos vecinos, si no, daría un salto.
      const len = Math.hypot(ex, ey);
      if (len > 2.5) { ex = ex / len * 2.5; ey = ey / len * 2.5; }
  
      const aire = (S.flags[e] & FLAG.IGNORA_GRAVEDAD) !== 0;
      const nx = S.x[e] + ex * EMPUJE_MAX * dt;
      const ny = aire ? S.y[e] + ey * EMPUJE_MAX * dt : S.y[e];
      // Nunca se empuja dentro de la roca: primero se intenta el movimiento
      // completo y, si no cabe, sólo el horizontal.
      if (!mundo.fisica.solapaSolido(nx, ny, S.hw[e], S.hh[e])) {
        S.x[e] = nx; S.y[e] = ny;
      } else if (!mundo.fisica.solapaSolido(nx, S.y[e], S.hw[e], S.hh[e])) {
        S.x[e] = nx;
      }
    }
  }
  
  // ------------------------------------------------------------- tejedores ---
  
  function emparejarTejedor(mundo, e) {
    const S = mundo.ent;
    for (let i = 0; i < S.count; i++) {
      const o = S.dense[i];
      if (o === e || S.alive[o] !== 1) continue;
      if (S.tipo[o] !== TIPO.TEJEDOR) continue;
      if (S.resolve(S.enlace[o]) >= 0) continue;
      S.enlace[o] = S.handle(e);
      S.enlace[e] = S.handle(o);
      return;
    }
  }
  
  // ------------------------------------------------------------------- IA ----
  
  function actualizarEnemigo(mundo, e, dt) {
    const S = mundo.ent;
    const tipo = S.tipo[e];
    const j = mundo.jugador;
    if (!j || j.id < 0) return;
  
    S.anim[e] += dt * S.velAnim[e];
    S.flash[e] = Math.max(0, S.flash[e] - dt * 6);
    S.sinGolpe[e] += dt;
    S.marca[e] = Math.max(0, S.marca[e] - dt);
  
    // Regeneración de aguante y de vida (élite regenerador).
    if (S.sinGolpe[e] > 1.3 && S.aturdido[e] <= 0) {
      S.aguante[e] = Math.min(S.aguanteMax[e], S.aguante[e] + S.aguanteMax[e] * 0.45 * dt);
    }
    if ((S.flags[e] & FLAG.ELITE) && S.variante[e] === ELITE.REGENERADOR && S.sinGolpe[e] > 2) {
      S.vida[e] = Math.min(S.vidaMax[e], S.vida[e] + S.vidaMax[e] * 0.07 * dt);
    }
  
    // Aturdido: ni se mueve ni ataca. Es la ventana para castigarlo.
    if (S.aturdido[e] > 0) {
      S.aturdido[e] -= dt;
      S.vx[e] = approach(S.vx[e], 0, 700 * dt);
      if ((S.flags[e] & FLAG.IGNORA_GRAVEDAD) !== 0) S.vy[e] = approach(S.vy[e], 0, 700 * dt);
      if (S.aturdido[e] <= 0) S.t1[e] = 0.45;
      return;
    }
  
    S.t1[e] -= dt;
    S.t2[e] = Math.max(0, S.t2[e] - dt);
  
    const d = haciaJugador(mundo, e);
    const dx = mundo._dx, dy = mundo._dy;
    const vivo = j.estado !== 6;
    const st = STATS[tipo];
    const A = (S.flags[e] & FLAG.ELITE) ? AJUSTE_ELITE[S.variante[e]] : null;
    const vel = st.vel * (A ? A.vel : 1);
  
    switch (tipo) {
      case TIPO.DRON: dron(mundo, e, dt, d, dx, dy, vivo, vel); break;
      case TIPO.RASTREADOR: rastreador(mundo, e, dt, d, dx, dy, vivo, vel); break;
      case TIPO.VOLADOR: volador(mundo, e, dt, d, dx, dy, vivo, vel); break;
      case TIPO.ESCUDO: escudo(mundo, e, dt, d, dx, dy, vivo, vel); break;
      case TIPO.ENJAMBRE: enjambre(mundo, e, dt, dx, dy, vel); break;
      case TIPO.BOMBARDERO: bombardero(mundo, e, dt, d, dx, dy, vivo, vel); break;
      case TIPO.TORRETA: torreta(mundo, e, dt, d, vivo); break;
      case TIPO.TEJEDOR: tejedor(mundo, e, dt, d, dx, dy, vivo, vel); break;
      case TIPO.ESPEJO: espejo(mundo, e, dt, d, dx, dy, vivo, vel); break;
      case TIPO.DIVISOR: divisor(mundo, e, dt, d, dx, dy, vivo, vel); break;
      default: break;
    }
  }
  
  // --- Dron: fuego de supresión a media distancia -----------------------------
  function dron(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    const j = mundo.jugador;
    const ideal = 230;
    const empuje = d < ideal - 40 ? -1 : d > ideal + 40 ? 1 : 0;
    S.vx[e] = approach(S.vx[e], dx * vel * empuje, 400 * dt);
    S.vy[e] = approach(S.vy[e], dy * vel * empuje + Math.sin(S.anim[e] * 0.7 + S.a[e]) * 45, 400 * dt);
    S.facing[e] = dx > 0 ? 1 : -1;
  
    if (S.estado[e] === 0 && S.t1[e] <= 0 && d < 520 && vivo &&
        mundo.lineaDeVision(S.x[e], S.y[e], j.x, j.y)) {
      S.estado[e] = 1;
      S.t1[e] = 2.1 + mundo.rng.float() * 1.1;
      S.d[e] = 3;
      S.a[e] = Math.atan2(j.y - S.y[e], j.x - S.x[e]);
      comprometer(mundo, e, 0.5);
      mundo.fx.zonaCono(S.x[e], S.y[e], S.a[e], 0.16, 520, 0.5, S.handle(e));
    }
    if (S.estado[e] === 1 && S.t2[e] <= 0) {
      soltarCompromiso(S, e);
      if (S.d[e] > 0) {
        const ang = Math.atan2(j.y - S.y[e], j.x - S.x[e]) + mundo.rng.spread(0.07);
        dispararEnemigo(mundo, S.x[e] + dx * 20, S.y[e] + dy * 20, ang, 360, S.dmg[e]);
        mundo.fx.fogonazo(S.x[e] + dx * 20, S.y[e] + dy * 20, ang, 1, 0.35, 0.5);
        S.d[e]--;
        S.t2[e] = 0.13;
      } else S.estado[e] = 0;
    }
  }
  
  // --- Rastreador: persigue por el suelo y embiste ----------------------------
  function rastreador(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    const j = mundo.jugador;
    const enSuelo = S.b[e] > 0;
  
    if (S.estado[e] === 0) {
      const dir = sign(dx) || 1;
      S.vx[e] = approach(S.vx[e], dir * vel * (d > 90 ? 1 : 0), 900 * dt);
      S.facing[e] = dir;
  
      // Salta con criterio: si tiene un muro delante, o si el suelo se acaba y
      // el jugador está al otro lado. Antes saltaba al azar y se veía tonto.
      if (enSuelo) {
        const frente = S.x[e] + dir * (S.hw[e] + 18);
        const hayMuro = S.c[e] > 0;
        const hayHueco = !mundo.fisica.haySueloBajo(frente, S.y[e], 6, S.hh[e], 8);
        const jugadorArriba = j.y < S.y[e] - 50;
        if (hayMuro || (hayHueco && Math.abs(j.x - S.x[e]) > 40) || (jugadorArriba && mundo.rng.bool(0.03))) {
          S.vy[e] = -560;
          S.c[e] = 0;
        }
      }
  
      if (d < 270 && Math.abs(j.y - S.y[e]) < 80 && S.t1[e] <= 0 && vivo) {
        S.estado[e] = 1;
        S.t1[e] = 2.6;
        comprometer(mundo, e, 0.46);
        const alcance = 340;
        mundo.fx.zonaLinea(S.x[e], S.y[e], S.x[e] + S.facing[e] * alcance, S.y[e],
          S.hh[e] * 2.1, 0.46, S.handle(e));
      }
    } else if (S.estado[e] === 1) {
      S.vx[e] = approach(S.vx[e], 0, 1800 * dt);
      if (S.t2[e] <= 0) {
        soltarCompromiso(S, e);
        S.estado[e] = 2; S.t2[e] = 0.55;
        S.vx[e] = S.facing[e] * 640;
        if (S.b[e] > 0) S.vy[e] = -190;
        mundo.fx.dash(S.x[e], S.y[e], S.facing[e] > 0 ? 0 : Math.PI);
      }
    } else if (S.t2[e] <= 0) S.estado[e] = 0;
  }
  
  // --- Volador: vuelo ondulante y picado --------------------------------------
  function volador(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    const j = mundo.jugador;
    S.a[e] += dt * 2.4;
    if (S.estado[e] === 0) {
      const alturaObjetivo = j.y - 130;
      S.vx[e] = approach(S.vx[e], dx * vel, 500 * dt);
      S.vy[e] = approach(S.vy[e], (alturaObjetivo - S.y[e]) * 2.4 + Math.sin(S.a[e]) * 70, 600 * dt);
      S.facing[e] = dx > 0 ? 1 : -1;
      if (Math.abs(j.x - S.x[e]) < 100 && S.y[e] < j.y - 60 && S.t1[e] <= 0 && vivo) {
        S.estado[e] = 1; S.t1[e] = 3.2;
        comprometer(mundo, e, 0.38);
        mundo.fx.zonaLinea(S.x[e], S.y[e], S.x[e], S.y[e] + 420, S.hw[e] * 2.2, 0.38, S.handle(e));
      }
    } else if (S.estado[e] === 1) {
      S.vx[e] = approach(S.vx[e], 0, 1400 * dt);
      S.vy[e] = approach(S.vy[e], -60, 900 * dt);
      if (S.t2[e] <= 0) {
        soltarCompromiso(S, e);
        S.estado[e] = 2; S.t2[e] = 0.8;
        S.vx[e] = dx * 240; S.vy[e] = 780;
      }
    } else {
      S.vy[e] = approach(S.vy[e], -140, 700 * dt);
      if (S.t2[e] <= 0) S.estado[e] = 0;
    }
  }
  
  // --- Escudo: avanza de frente; hay que rodearlo -----------------------------
  function escudo(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    const j = mundo.jugador;
    const dir = sign(dx) || 1;
    S.facing[e] = dir;
    S.vx[e] = approach(S.vx[e], dir * vel, 500 * dt);
    S.angulo[e] = Math.atan2(j.y - S.y[e], j.x - S.x[e]);
  
    if (S.estado[e] === 0 && S.t1[e] <= 0 && d < 420 && vivo) {
      S.estado[e] = 1;
      S.t1[e] = 2.6 + mundo.rng.float();
      S.a[e] = S.angulo[e];
      comprometer(mundo, e, 0.55);
      mundo.fx.zonaCono(S.x[e], S.y[e], S.a[e], 0.30, 420, 0.55, S.handle(e));
    } else if (S.estado[e] === 1 && S.t2[e] <= 0) {
      soltarCompromiso(S, e);
      S.estado[e] = 0;
      const base = S.angulo[e];
      for (let k = -1; k <= 1; k++) {
        dispararEnemigo(mundo, S.x[e] + dx * 24, S.y[e], base + k * 0.24, 320, S.dmg[e] * 0.6);
      }
      mundo.fx.fogonazo(S.x[e] + dx * 24, S.y[e], base, 0.5, 0.75, 1);
    }
  }
  
  // --- Enjambre: bandada sin frenos -------------------------------------------
  function enjambre(mundo, e, dt, dx, dy, vel) {
    const S = mundo.ent;
    S.a[e] += dt * 6;
    S.vx[e] = approach(S.vx[e], dx * vel + Math.cos(S.a[e]) * 90, 900 * dt);
    S.vy[e] = approach(S.vy[e], dy * vel + Math.sin(S.a[e] * 1.3) * 90, 900 * dt);
    S.facing[e] = dx > 0 ? 1 : -1;
  }
  
  // --- Bombardero: se acerca, pita y revienta ---------------------------------
  function bombardero(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    if (S.estado[e] === 0) {
      S.vx[e] = approach(S.vx[e], dx * vel, 260 * dt);
      S.vy[e] = approach(S.vy[e], dy * vel, 260 * dt);
      if (d < 140 && vivo) {
        S.estado[e] = 1;
        comprometer(mundo, e, 0.95);
        // El círculo dice exactamente hasta dónde llega. Y se puede devolver.
        mundo.fx.zonaCirculo(S.x[e], S.y[e], 130, 0.95, S.handle(e), 1, 0.5, 0.2);
      }
    } else {
      S.vx[e] = approach(S.vx[e], dx * 60, 400 * dt);
      S.vy[e] = approach(S.vy[e], dy * 60, 400 * dt);
      S.flash[e] = 0.35 + 0.65 * Math.abs(Math.sin(S.t2[e] * 22));
      if (S.t2[e] <= 0) { mundo.matarEnemigo(e, true); }
    }
  }
  
  // --- Torreta ---------------------------------------------------------------
  function torreta(mundo, e, dt, d, vivo) {
    const S = mundo.ent;
    const j = mundo.jugador;
    S.angulo[e] = Math.atan2(j.y - S.y[e], j.x - S.x[e]);
    if (S.estado[e] === 0) {
      if (S.t1[e] <= 0 && d < 560 && vivo && mundo.lineaDeVision(S.x[e], S.y[e] - 14, j.x, j.y)) {
        S.estado[e] = 1;
        S.t1[e] = S.d[e] || 1.9;
        comprometer(mundo, e, 0.6);
        mundo.fx.zonaCono(S.x[e], S.y[e] - 14, S.angulo[e], 0.16, 560, 0.6, S.handle(e));
      }
    } else if (S.t2[e] <= 0) {
      soltarCompromiso(S, e);
      const base = S.angulo[e];
      for (let k = 0; k < 3; k++) {
        dispararEnemigo(mundo, S.x[e] + Math.cos(base) * 26, S.y[e] - 14 + Math.sin(base) * 26,
          base + (k - 1) * 0.14, 400, S.dmg[e]);
      }
      mundo.fx.fogonazo(S.x[e] + Math.cos(base) * 26, S.y[e] - 14 + Math.sin(base) * 26, base, 1, 0.4, 0.5);
      mundo.camara.sacudir(0.05);
      S.estado[e] = 0;
    }
  }
  
  // --- Tejedor: dos nodos y un cable entre ellos ------------------------------
  function tejedor(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    const j = mundo.jugador;
    const pareja = S.resolve(S.enlace[e]);
  
    if (pareja >= 0) {
      // En pareja: se colocan a los lados del jugador para cruzarle el cable.
      const lado = S.handle(e) > S.enlace[e] ? 1 : -1;
      const objX = j.x + lado * 190;
      const objY = j.y - 40 + Math.sin(S.anim[e] * 0.5 + S.a[e]) * 40;
      S.vx[e] = approach(S.vx[e], (objX - S.x[e]) * 1.6, 340 * dt);
      S.vy[e] = approach(S.vy[e], (objY - S.y[e]) * 1.6, 340 * dt);
    } else {
      // Solo: se vuelve agresivo y dispara en abanico.
      S.vx[e] = approach(S.vx[e], dx * vel * 1.3, 400 * dt);
      S.vy[e] = approach(S.vy[e], dy * vel * 1.3 - 40, 400 * dt);
      if (S.estado[e] === 0 && S.t1[e] <= 0 && d < 460 && vivo) {
        S.estado[e] = 1;
        S.t1[e] = 2.4;
        S.a[e] = Math.atan2(j.y - S.y[e], j.x - S.x[e]);
        comprometer(mundo, e, 0.45);
        mundo.fx.zonaCono(S.x[e], S.y[e], S.a[e], 0.45, 400, 0.45, S.handle(e));
      } else if (S.estado[e] === 1 && S.t2[e] <= 0) {
        soltarCompromiso(S, e);
        S.estado[e] = 0;
        for (let k = -2; k <= 2; k++) {
          dispararEnemigo(mundo, S.x[e], S.y[e], S.a[e] + k * 0.22, 330, S.dmg[e] * 0.55);
        }
        mundo.fx.fogonazo(S.x[e], S.y[e], S.a[e], 0.5, 1, 0.85);
      }
    }
    S.facing[e] = dx > 0 ? 1 : -1;
  }
  
  // --- Espejo: te devuelve tus disparos salvo cuando se abre -------------------
  function espejo(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    const j = mundo.jugador;
    const ideal = 260;
    const empuje = d < ideal - 50 ? -1 : d > ideal + 50 ? 1 : 0;
    S.vx[e] = approach(S.vx[e], dx * vel * empuje, 320 * dt);
    S.vy[e] = approach(S.vy[e], dy * vel * empuje + Math.sin(S.anim[e] * 0.5) * 30, 320 * dt);
    S.facing[e] = dx > 0 ? 1 : -1;
    S.angulo[e] = Math.atan2(j.y - S.y[e], j.x - S.x[e]);
  
    if ((S.flags[e] & FLAG.ABIERTO) === 0) {
      if (S.t1[e] <= 0) {
        // Se abre: es la ventana para castigarlo. Se avisa en verde, no en rojo:
        // esto es una oportunidad, no una amenaza.
        S.flags[e] |= FLAG.ABIERTO;
        S.t1[e] = 1.15;
        S.sprite[e] = mundo.R.idx('enem.espejoAbierto.0');
        S.cuadros[e] = 3;
        mundo.fx.zonaCirculo(S.x[e], S.y[e], 46, 1.15, S.handle(e), 0.4, 1, 0.6);
        mundo.eventos.emit(EV.CARGA_LISTA, S.x[e], S.y[e], 1, 0);
      }
    } else if (S.t1[e] <= 0) {
      S.flags[e] &= ~FLAG.ABIERTO;
      S.t1[e] = 2.6 + mundo.rng.float() * 1.2;
      S.sprite[e] = mundo.R.idx('enem.espejo.0');
      S.cuadros[e] = 4;
      // Al cerrarse suelta una descarga hacia el jugador.
      if (vivo && d < 520) {
        dispararEnemigo(mundo, S.x[e], S.y[e], S.angulo[e], 340, S.dmg[e]);
        mundo.fx.fogonazo(S.x[e], S.y[e], S.angulo[e], 0.8, 0.9, 1);
      }
    }
  }
  
  // --- Divisor: se parte en dos al morir --------------------------------------
  function divisor(mundo, e, dt, d, dx, dy, vivo, vel) {
    const S = mundo.ent;
    const enSuelo = S.b[e] > 0;
    if (S.estado[e] === 0) {
      const dir = sign(dx) || 1;
      S.facing[e] = dir;
      S.vx[e] = approach(S.vx[e], dir * vel, 620 * dt);
      if (enSuelo && (S.c[e] > 0 || mundo.rng.bool(0.012))) { S.vy[e] = -430; S.c[e] = 0; }
      if (d < 150 && S.t1[e] <= 0 && vivo) {
        S.estado[e] = 1;
        S.t1[e] = 2.2;
        comprometer(mundo, e, 0.5);
        mundo.fx.zonaCirculo(S.x[e], S.y[e], 110 * (S.escala[e] || 1), 0.5, S.handle(e));
      }
    } else if (S.t2[e] <= 0) {
      soltarCompromiso(S, e);
      S.estado[e] = 0;
      // Pisotón: onda de área alrededor.
      const radio = 110 * (S.escala[e] || 1);
      mundo.golpeArea(S.x[e], S.y[e], radio, S.dmg[e], e);
      mundo.fx.explosionGrande(S.x[e], S.y[e], 0.7 * (S.escala[e] || 1));
      mundo.camara.sacudir(0.22);
      if (enSuelo) S.vy[e] = -180;
    }
  }
  
  /** Al morir, un divisor deja dos crías más pequeñas. */
  function partirDivisor(mundo, e) {
    const S = mundo.ent;
    const nivel = S.variante[e];
    if (nivel >= 2) return 0;
    let creados = 0;
    for (let k = 0; k < 2; k++) {
      const ang = k === 0 ? -2.2 : -0.94;
      const hijo = crearEnemigo(mundo, TIPO.DIVISOR,
        S.x[e] + Math.cos(ang) * 26, S.y[e] - 10, false, mundo.progresion.escalaVida(), nivel + 1);
      if (hijo < 0) continue;
      S.vx[hijo] = Math.cos(ang) * 240;
      S.vy[hijo] = -260;
      creados++;
    }
    return creados;
  }
  
  /** ¿El escudo frontal bloquea un impacto que llega desde (ix,iy)? */
  function bloqueaEscudo(S, e, ix, iy) {
    if ((S.flags[e] & FLAG.ESCUDO_FRONTAL) === 0) return false;
