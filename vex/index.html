<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>VEX — Colapso Neuronal</title>
<meta name="description" content="Roguelite de accion y plataformas en WebGL2. Sin motores, sin librerias y sin un solo archivo de imagen o de audio: todo el arte y todo el sonido se generan por codigo en tiempo real.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 fill=%22%23050a14%22/><path d=%22M14 16 L32 46 L50 16%22 stroke=%22%234fe3ff%22 stroke-width=%228%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #04060c; color: #cfe9f5;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #juego {
    display: block; width: 100vw; height: 100vh;
    image-rendering: auto; cursor: none; touch-action: none;
  }
  #aviso {
    position: fixed; inset: 0; display: grid; place-content: center;
    text-align: center; padding: 2rem; gap: .5rem;
    background: radial-gradient(circle at 50% 40%, #0d1c31, #04060c 70%);
    z-index: 10;
  }
  #aviso h1 { font-size: clamp(1.6rem, 5vw, 3rem); letter-spacing: .18em; margin: 0 0 .5rem; color: #6fe0ff; }
  #aviso p { margin: .25rem 0; opacity: .8; max-width: 46ch; line-height: 1.5; }
  #aviso.error h1 { color: #ff6f92; }
  .cargando::after {
    content: ''; display: block; width: 200px; height: 3px; margin: 1.5rem auto 0;
    background: linear-gradient(90deg, transparent, #4fe3ff, transparent);
    animation: barrido 1.1s linear infinite;
  }
  @keyframes barrido { from { transform: translateX(-60px); opacity: .2 } 50% { opacity: 1 } to { transform: translateX(60px); opacity: .2 } }
</style>
</head>
<body>
  <canvas id="juego" width="1280" height="720" aria-label="VEX: Colapso Neuronal"></canvas>
  <div id="aviso" class="cargando">
    <h1>VEX</h1>
    <p>Generando arte, sonido y niveles por codigo...</p>
  </div>
  <script>
    // Si los modulos no llegan a cargar, la pantalla de carga se quedaria fija
    // para siempre. Este vigia explica el motivo real, que casi siempre es uno
    // de dos: falta la carpeta src/ junto al HTML, o se ha abierto el archivo
    // con doble clic y file:// bloquea los modulos ES por CORS.
    setTimeout(function () {
      if (window.JUEGO) return;
      var aviso = document.getElementById('aviso');
      if (!aviso || aviso.classList.contains('error')) return;
      var suelto = location.protocol === 'file:';
      aviso.classList.remove('cargando');
      aviso.classList.add('error');
      aviso.innerHTML =
        '<h1>No se pudieron cargar los modulos</h1>' +
        (suelto
          ? '<p>Has abierto <code>index.html</code> directamente desde el disco. ' +
            'El navegador bloquea los modulos ES en <code>file://</code>, y ademas ' +
            'este archivo necesita la carpeta <code>src/</code> a su lado.</p>' +
            '<p><strong>Usa <code>vex.html</code></strong>: es el juego entero en un ' +
            'unico archivo y funciona con doble clic.</p>'
          : '<p>Falta la carpeta <code>src/</code> junto a <code>index.html</code>, ' +
            'o el servidor no la esta sirviendo.</p>') +
        '<p>Tambien puedes servir la carpeta completa:<br>' +
        '<code>python3 -m http.server 8000 --directory vex</code></p>';
    }, 5000);
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
