<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Senda del Director — Claude Code desde cero</title>

      </div>
      <button id="btnA" data-k=" " aria-label="Acción">A</button>
    </div>
  </div>
